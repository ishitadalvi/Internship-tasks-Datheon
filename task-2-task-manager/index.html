<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --ink: #1e2340; --muted: #6b7090;
    --line: #dde1ec; --accent: #5b4bdb;
    --work: #2f6fdb; --personal: #d6457a; --study: #1f9d6b; --late: #c2371f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.45;
  }
  .app { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 20px; color: var(--muted); }

  /* ---- add bar ---- */
  .add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .add input[type=text] { flex: 1 1 100%; }
  .add select, .add input[type=date] { flex: 1 1 140px; }
  input, select, button { font: inherit; color: inherit; }
  input, select {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { cursor: pointer; }
  .btn-add {
    flex: 1 1 100%; padding: 10px 16px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .btn-add:hover { background: #4a3bc4; }

  /* ---- toolbar ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filters { display: flex; gap: 6px; }
  .filters button {
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
  }
  .filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  #search { flex: 1 1 140px; padding: 7px 12px; }
  .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 8px; }

  /* ---- list ---- */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--cat);
    border-radius: 8px; transition: opacity 0.3s, background 0.3s;
  }
  li[data-cat="Work"] { --cat: var(--work); }
  li[data-cat="Personal"] { --cat: var(--personal); }
  li[data-cat="Study"] { --cat: var(--study); }
  li.dragging { opacity: 0.4; }
  li.over { background: #ecebfb; }
  .handle { cursor: grab; color: var(--muted); user-select: none; }
  .body { flex: 1; min-width: 0; }
  .text { display: inline-block; position: relative; word-break: break-word; transition: color 0.3s; }
  /* the strike-through line grows across the text when completed */
  .text::after {
    content: ""; position: absolute; left: 0; top: 52%; height: 2px; width: 0;
    background: var(--muted); transition: width 0.35s ease;
  }
  li.done .text { color: var(--muted); }
  li.done .text::after { width: 100%; }
  li.done { opacity: 0.7; }
  li.pop { animation: pop 0.35s ease; }
  @keyframes pop { 50% { transform: scale(1.03); } }
  .meta { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .meta .cat { color: var(--cat); font-weight: 600; }
  .meta .late { color: var(--late); font-weight: 600; }
  .actions { display: flex; gap: 4px; }
  .actions button { border: 0; background: none; padding: 6px 8px; border-radius: 6px; color: var(--muted); }
  .actions button:hover { background: var(--bg); color: var(--ink); }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .edit-input { width: 100%; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <h1>Taskboard</h1>
  <p class="sub">Plan it, tick it, keep it. Your tasks stay saved in this browser.</p>

  <div class="add">
    <input type="text" id="taskInput" placeholder="What needs doing?" maxlength="120" aria-label="Task">
    <select id="categoryInput" aria-label="Category">
      <option>Work</option><option>Personal</option><option>Study</option>
    </select>
    <input type="date" id="dateInput" aria-label="Due date">
    <button class="btn-add" id="addBtn">Add task</button>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>
    <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
  </div>
  <p class="count" id="count"></p>

  <ul id="taskList"></ul>
</main>

<script>
/* =========================================================
   1. STATE: the single source of truth
   Every task looks like:
   { id, text, category, due, completed }
   ========================================================= */
const STORAGE_KEY = "taskboard.tasks";
let tasks = [];
let currentFilter = "all";   // "all" | "active" | "completed"
let searchTerm = "";
let editingId = null;        // id of the task being edited, or null
let justToggledId = null;    // used only for the completion animation
let dragId = null;           // id of the task being dragged

/* =========================================================
   2. STORAGE: save and load
   localStorage only stores strings, so we convert with JSON.
   ========================================================= */
function saveToLocalStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (err) {
    console.error("Could not save tasks:", err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    tasks = saved ? JSON.parse(saved) : [];
  } catch (err) {
    console.error("Could not load tasks:", err);
    tasks = [];
  }
}

/* =========================================================
   3. ACTIONS: each one changes the array, saves, then redraws
   ========================================================= */
function addTask(text, category, due) {
  tasks.unshift({
    id: Date.now().toString(),
    text: text,
    category: category,
    due: due,
    completed: false
  });
  update();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  update();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  task.completed = !task.completed;
  justToggledId = id;
  update();
}

function editTask(id, newText) {
  const task = tasks.find(t => t.id === id);
  if (newText.trim()) task.text = newText.trim();
  editingId = null;
  update();
}

function moveTask(fromId, toId) {
  const from = tasks.findIndex(t => t.id === fromId);
  const to = tasks.findIndex(t => t.id === toId);
  const [moved] = tasks.splice(from, 1);
  tasks.splice(to, 0, moved);
  update();
}

function update() {
  saveToLocalStorage();
  render();
}

/* =========================================================
   4. RENDER: draw the list from the array (never the reverse)
   ========================================================= */
const listEl = document.getElementById("taskList");
const countEl = document.getElementById("count");

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function todayString() {
  return new Date().toLocaleDateString("en-CA"); // gives YYYY-MM-DD
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-IN", { day: "numeric", month: "short" });
}

function getVisibleTasks() {
  return tasks.filter(t => {
    if (currentFilter === "active" && t.completed) return false;
    if (currentFilter === "completed" && !t.completed) return false;
    return t.text.toLowerCase().includes(searchTerm.toLowerCase());
  });
}

function render() {
  const visible = getVisibleTasks();
  const activeCount = tasks.filter(t => !t.completed).length;
  countEl.textContent = activeCount + " active, " + (tasks.length - activeCount) + " completed";

  if (visible.length === 0) {
    const msg = tasks.length === 0
      ? "No tasks yet. Type one above and press Add task."
      : "Nothing matches this filter or search.";
    listEl.innerHTML = '<li class="empty" style="display:block;border:0;background:none">' + msg + "</li>";
    return;
  }

  listEl.innerHTML = visible.map(t => {
    const late = t.due && !t.completed && t.due < todayString();
    const dueText = t.due
      ? ' · <span class="' + (late ? "late" : "") + '">' + (late ? "Overdue " : "Due ") + formatDate(t.due) + "</span>"
      : "";
    const textPart = editingId === t.id
      ? '<input class="edit-input" id="editField" value="' + escapeHTML(t.text).replace(/"/g, "&quot;") + '" maxlength="120">'
      : '<span class="text">' + escapeHTML(t.text) + "</span>";

    return '<li draggable="true" data-id="' + t.id + '" data-cat="' + t.category + '" class="' +
      (t.completed ? "done " : "") + (t.id === justToggledId ? "pop" : "") + '">' +
      '<span class="handle" title="Drag to reorder">⋮⋮</span>' +
      '<input type="checkbox" data-action="toggle" aria-label="Mark complete"' + (t.completed ? " checked" : "") + ">" +
      '<div class="body">' + textPart +
        '<div class="meta"><span class="cat">' + t.category + "</span>" + dueText + "</div></div>" +
      '<div class="actions">' +
        '<button data-action="edit" aria-label="Edit task">Edit</button>' +
        '<button data-action="delete" aria-label="Delete task">Delete</button>' +
      "</div></li>";
  }).join("");

  justToggledId = null;

  const field = document.getElementById("editField");
  if (field) { field.focus(); field.setSelectionRange(field.value.length, field.value.length); }
}

/* =========================================================
   5. EVENTS
   ========================================================= */
const taskInput = document.getElementById("taskInput");
const categoryInput = document.getElementById("categoryInput");
const dateInput = document.getElementById("dateInput");

function handleAdd() {
  const text = taskInput.value.trim();
  if (!text) { taskInput.focus(); return; }
  addTask(text, categoryInput.value, dateInput.value);
  taskInput.value = "";
  dateInput.value = "";
  taskInput.focus();
}

document.getElementById("addBtn").addEventListener("click", handleAdd);
taskInput.addEventListener("keydown", e => { if (e.key === "Enter") handleAdd(); });

// Filter buttons
document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b === btn));
  render();
});

// Search
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

// Event delegation: one listener on the list handles every task's buttons
listEl.addEventListener("click", e => {
  const li = e.target.closest("li[data-id]");
  const action = e.target.dataset.action;
  if (!li || !action) return;
  const id = li.dataset.id;
  if (action === "delete") deleteTask(id);
  if (action === "toggle") toggleTask(id);
  if (action === "edit") { editingId = id; render(); }
});

// Save or cancel an edit
listEl.addEventListener("keydown", e => {
  if (e.target.id !== "editField") return;
  const id = e.target.closest("li").dataset.id;
  if (e.key === "Enter") editTask(id, e.target.value);
  if (e.key === "Escape") { editingId = null; render(); }
});
listEl.addEventListener("focusout", e => {
  if (e.target.id === "editField" && editingId) {
    editTask(e.target.closest("li").dataset.id, e.target.value);
  }
});

// Drag and drop reordering
listEl.addEventListener("dragstart", e => {
  const li = e.target.closest("li[data-id]");
  if (!li) return;
  dragId = li.dataset.id;
  li.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
listEl.addEventListener("dragover", e => {
  e.preventDefault(); // required, otherwise drop never fires
  const li = e.target.closest("li[data-id]");
  document.querySelectorAll("li.over").forEach(x => x.classList.remove("over"));
  if (li && li.dataset.id !== dragId) li.classList.add("over");
});
listEl.addEventListener("drop", e => {
  e.preventDefault();
  const li = e.target.closest("li[data-id]");
  if (li && dragId && li.dataset.id !== dragId) moveTask(dragId, li.dataset.id);
  dragId = null;
});
listEl.addEventListener("dragend", () => { dragId = null; render(); });

/* =========================================================
   6. START
   ========================================================= */
loadFromLocalStorage();
render();
</script>
</body>
</html>
